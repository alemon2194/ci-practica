name: Secretos

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  prueba:
    name: Probar secret y variable
    runs-on: ubuntu-latest
    steps:
      - name: Leer secret y variable
        env:
          MI_SECRETO: ${{ secrets.MI_SECRETO }}
        run: |
          echo "Variable: ${{ vars.ENTORNO }}"
          echo "Secret: $MI_SECRETO"
          echo "Longitud del secret: ${#MI_SECRETO}"

      - name: Experimento de enmascarado
        env:
          MI_SECRETO: ${{ secrets.MI_SECRETO }}
        run: echo "$MI_SECRETO" | sed 's/./& /g'
