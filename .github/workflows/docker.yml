name: Docker (reutilizable)

on:
  workflow_call:
    inputs:
      image-tag:
        description: Etiqueta que llevará la imagen
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  imagen:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Descargar el jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.image-tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
