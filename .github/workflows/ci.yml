name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  APP_NAME: ci-practica

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Mostrar contexto
        run: |
          echo "App: ${{ env.APP_NAME }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Autor: ${{ github.actor }}"

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar sin tests
        run: ./mvnw -B -DskipTests package

      - name: Guardar el jar como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Aviso solo en main
        if: github.ref == 'refs/heads/main'
        run: echo "Esto solo se ejecuta al subir a main"

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar tests
        run: ./mvnw -B test

  verificar:
    name: Verificar artefacto
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: artefactos

      - name: Listar lo descargado
        run: ls -lh artefactos

  docker:
    name: Imagen Docker
    needs: test
    uses: ./.github/workflows/docker.yml
    with:
      image-tag: ${{ github.sha }}
